{% set name = "pyriemann" %}
{% set version = "0.12" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a1450307bf3360fafe4e2e11a5db81889245f34b0042094bf8b59b7fe2bdeb9f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy >=1.25.0
    - scipy
    - scikit-learn >=0.24
    - joblib
    - matplotlib-base
    - array-api-compat >=1.11
    - array-api-extra >=0.6

test:
  imports:
    - pyriemann
    - pyriemann.classification
    - pyriemann.clustering
    - pyriemann.embedding
    - pyriemann.estimation
    - pyriemann.spatialfilters
    - pyriemann.stats
    - pyriemann.tangentspace
    - pyriemann.utils
    - pyriemann.utils.covariance
    - pyriemann.utils.distance
    - pyriemann.utils.mean
    - pyriemann.utils.viz
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://pyriemann.readthedocs.io/en/latest/
  summary: Biosignals classification with Riemannian Geometry
  description: |
    pyRiemann aims at being a generic package for multivariate signal
    classification but has been designed around applications of biosignal
    (M/EEG, EMG, etc) classification.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/pyRiemann/pyRiemann

extra:
  recipe-maintainers:
    - larsoner
    - hoechenberger
